[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slf-trace"
version = "0.1.0"
description = "Central dashboard and station companion platform for production measuring stations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "panel>=1.6",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]
smb = [
    "pysmb>=1.2.10",
]
serial = [
    "pyserial>=3.5",
]

[project.scripts]
slf-trace-api = "slf_trace.api.main:run"
slf-trace-companion = "slf_trace.companion.main:run"
slf-trace-ui = "slf_trace.ui.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/slf_trace"]
include = ["src/slf_trace/ui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
