name: Build Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ubuntu:
    name: Build Ubuntu 24.04 ${{ matrix.role }} artifact
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: station
            target: ubuntu24-x64-panel
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v3
        with:
          init-shell: bash

      - name: Build packed environment
        run: TARGET="${{ matrix.target }}" deploy/scripts/build-packed-env.sh

      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@v4
        with:
          name: slf-trace-${{ matrix.target }}-${{ github.sha }}
          path: dist/offline/*/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows x64 ${{ matrix.role }} artifact
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: server
            target: windows-x64-server
          - role: station
            target: windows-x64-panel
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          channels: conda-forge,defaults
          channel-priority: flexible
          auto-activate-base: false

      - name: Build packed environment
        shell: pwsh
        run: deploy/scripts/build-packed-env.ps1 -Target "${{ matrix.target }}" -CondaExe "$env:CONDA\Scripts\conda.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: slf-trace-${{ matrix.target }}-${{ github.sha }}
          path: dist/offline/*/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
